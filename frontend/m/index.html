<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f5f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PHAROS OCEAN · 出海工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%93%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/m/m.css">
</head>
<body>

<!-- ══ 01 启动页 ══ -->
<div id="splash" class="splash">
  <img class="hero" src="/m/assets/hero1.jpg" alt="">
  <div class="hero-veil"></div>

  <div class="splash-copy">
    <h1>PHAROS OCEAN</h1>
    <p class="tag">出海 · 让世界看见你的好产品</p>
    <p class="tag-en">Go Global · Let the World See Your Product</p>
  </div>

  <div class="splash-foot">
    <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
    <button id="splash-go" class="btn-gold">开启出海之旅 →</button>
    <div class="brm">AI <span>×</span> GLOBAL <span>×</span> GROWTH</div>
  </div>
</div>

<!-- ══ 02 登录 ══ -->
<div id="login" class="login hidden">
  <div class="login-top">
    <div class="login-hello"><h2>欢迎回来</h2><p>继续你的出海计划</p></div>
    <button id="login-avatar" class="avatar-btn">👤</button>
  </div>
  <form id="form-login" class="auth-form">
    <label>邮箱 / 手机号</label>
    <input id="lg-user" autocomplete="username" placeholder="输入账号">
    <label>密码</label>
    <div class="pw-wrap">
      <input id="lg-pass" type="password" autocomplete="current-password" placeholder="输入密码">
      <button type="button" id="lg-eye" class="eye" aria-label="显示密码"></button>
    </div>
    <div class="row-between">
      <label class="remember"><input type="checkbox" id="lg-remember" checked> 记住我</label>
      <button type="button" class="link" id="lg-forgot">忘记密码?</button>
    </div>
    <button type="submit" class="btn-gold full">登录 →</button>
    <p class="err" id="lg-err"></p>
  </form>
  <div class="or"><span>或使用以下方式登录</span></div>
  <div class="social">
    <button data-s="google" aria-label="Google"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4c-.2 1.2-.9 2.2-1.9 2.9v2.5h3.1c1.8-1.7 3-4.2 3-7.2z"/><path fill="#34A853" d="M12 22c2.7 0 4.9-.9 6.6-2.4l-3.1-2.5c-.9.6-2 .9-3.5.9-2.6 0-4.8-1.8-5.6-4.1H3.2v2.6C4.9 19.8 8.2 22 12 22z"/><path fill="#FBBC05" d="M6.4 13.9c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.5H3.2C2.4 9 2 10.4 2 12s.4 3 1.2 4.5l3.2-2.6z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 2.9 14.7 2 12 2 8.2 2 4.9 4.2 3.2 7.5l3.2 2.6C7.2 7.7 9.4 5.9 12 5.9z"/></svg></button>
    <button data-s="github" aria-label="GitHub"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#1b1f24" d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7 1 .7 2v3c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg></button>
    <button data-s="apple" aria-label="Apple"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#1b1f24" d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.7-1.8-3.3-1.8-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.3 1.3-2.5 1.3-2.6-.1 0-2.7-1-2.7-3.8zM14.3 5.9c.6-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.4-.6.7-1.1 1.8-1 2.9 1.1.1 2.2-.6 2.8-1.3z"/></svg></button>
  </div>
  <p class="switch">还没有账号？<button class="link" id="to-register">立即注册</button></p>

  <form id="form-register" class="auth-form hidden">
    <label>用户名</label>
    <input id="rg-user" autocomplete="username" placeholder="2-20 位字母、数字、下划线或中文">
    <label>密码</label>
    <input id="rg-pass" type="password" autocomplete="new-password" placeholder="至少 6 位">
    <label>确认密码</label>
    <input id="rg-pass2" type="password" autocomplete="new-password" placeholder="再输入一次">
    <label>公司 / 团队名称（选填）</label>
    <input id="rg-company" placeholder="用于方案定制">
    <label class="remember"><input type="checkbox" id="rg-agree"> 同意《服务条款》：AI 输出仅供参考</label>
    <button type="submit" class="btn-gold full">注册并进入</button>
    <p class="err" id="rg-err"></p>
    <p class="switch"><button type="button" class="link" id="to-login">← 返回登录</button></p>
  </form>
</div>

<!-- ══ 主应用 ══ -->
<div id="app" class="app hidden">
  <main id="page" class="page"></main>
  <nav class="tabbar">
    <button class="tab on" data-tab="home"><i></i><span>首页</span></button>
    <button class="tab" data-tab="agents"><i></i><span>智能体</span></button>
    <button class="tab" data-tab="project"><i></i><span>项目</span></button>
    <button class="tab" data-tab="platforms"><i></i><span>平台</span></button>
    <button class="tab" data-tab="me"><i></i><span>我的</span></button>
  </nav>
</div>

<!-- 聊天全屏 -->
<div id="chat" class="chat hidden">
  <header class="chat-head">
    <button id="chat-back" class="icon-btn back"></button>
    <div class="chat-title"><b id="chat-name">智能体</b><span id="chat-desc"></span></div>
    <button id="chat-clear" class="icon-btn" aria-label="清空">⋯</button>
  </header>
  <div id="chat-body" class="chat-body"></div>
  <div class="chat-input">
    <textarea id="chat-text" rows="1" placeholder="输入你的问题…"></textarea>
    <button id="chat-send" aria-label="发送"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg></button>
  </div>
</div>

<div id="sheet-mask" class="sheet-mask"></div>
<div id="sheet" class="sheet"></div>
<div id="toast" class="toast"></div>
<script src="/m/m.js"></script>
</body>
</html>
